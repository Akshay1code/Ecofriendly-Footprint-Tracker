<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🌿 Gamified Eco Profile Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        /* ===== Global Variables & Colors (Gamified Palette) ===== */
        :root {
            --primary-green: #2D5016; /* Deep Forest */
            --secondary-green: #4A7C59; /* Moss Green */
            --accent-gold: #FFD700; /* XP/Level Gold */
            --light-bg: #F5FFF5; /* Very Light Green-White */
            --dark-bg: #8FBC8F; /* Light Sage */
            --shadow-light: rgba(0, 0, 0, 0.1);
            --shadow-strong: rgba(45, 80, 22, 0.3);
            --transition-fast: all 0.2s ease-in-out;
            --transition-smooth: all 0.4s ease-in-out;
        }

        /* ===== Base Styles & Background ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--light-bg), var(--dark-bg));
            color: var(--primary-green);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            padding-top: 80px; /* offset for fixed navbar */
        }

        header {
            width: 100%;
            background: var(--primary-green);
            color: var(--accent-gold);
            padding: 1rem 2rem;
            text-align: center;
            box-shadow: 0 5px 15px var(--shadow-strong);
            font-weight: 700;
            font-size: 1.5rem;
            letter-spacing: 1px;
            position: sticky;
            top: 0;
            z-index: 100;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }

        /* Make navbar full-width and fixed on this page */
        .navbar {
            position: fixed !important;
            top: 0;
            left: 0;
            right: 0;
            width: 100%;
            z-index: 1000;
        }

        /* ===== Profile Card - The Main Component ===== */
        .profile-container {
            background: var(--light-bg);
            margin-top: 3rem;
            padding: 2.5rem;
            border-radius: 25px;
            /* Added a subtle gold inner border for gamification */
            box-shadow: 
                0 15px 35px var(--shadow-strong), 
                inset 0 0 0 4px var(--accent-gold); 
            max-width: 950px;
            width: 90%;
            animation: fadeIn 1.2s ease-out;
            position: relative;
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 2px dashed rgba(45, 80, 22, 0.2);
            margin-bottom: 1.5rem;
        }

        .profile-pic {
            width: 140px; /* Slightly larger */
            height: 140px;
            border-radius: 50%;
            border: 5px solid var(--accent-gold); /* Gold frame */
            outline: 5px solid var(--primary-green); /* Green outer ring */
            object-fit: cover;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
            transition: var(--transition-smooth);
        }

        .profile-pic:hover {
            transform: scale(1.05) rotate(5deg);
            box-shadow: 0 10px 20px var(--shadow-strong);
        }

        .profile-info h2 {
            font-size: 2.2rem;
            color: var(--primary-green);
            font-weight: 700;
            text-shadow: 1px 1px 1px rgba(0, 0, 0, 0.1);
        }

        /* Level tag for gamification */
        .level-tag {
            display: inline-block;
            background: var(--secondary-green);
            color: var(--accent-gold);
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: 600;
            margin-top: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        /* ===== XP Progress Bar (The Crown Jewel) ===== */
        .progress-container {
            margin-top: 1.5rem;
            background: var(--secondary-green);
            border-radius: 10px;
            overflow: hidden;
            height: 30px; /* Taller bar */
            position: relative;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.3);
        }

        .progress-bar {
            background: linear-gradient(90deg, var(--accent-gold), #FFEB3B); /* Gold Gradient */
            height: 100%;
            width: 0; /* Start at 0 for animation */
            border-radius: 10px;
            transition: width 1.5s cubic-bezier(0.25, 0.1, 0.25, 1);
            position: relative;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.7); /* Gold glow effect */
        }
        
        /* Progress Text Overlay for better UX */
        .progress-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--dark-green);
            font-weight: 700;
            font-size: 1rem;
            z-index: 10;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.8);
        }

        /* ===== Stats Grid (The Trophies) ===== */
        .stats-section {
            margin-top: 2.5rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); /* Better responsiveness */
            gap: 1.5rem;
        }

        .stat-card {
            background: var(--light-bg);
            border: 2px solid var(--secondary-green);
            padding: 1.5rem;
            border-radius: 15px;
            text-align: center;
            transition: var(--transition-fast);
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 10px var(--shadow-light);
        }
        
        /* Subtle Corner decoration */
        .stat-card::before {
            content: '⭐';
            position: absolute;
            top: -10px;
            right: -10px;
            font-size: 2rem;
            opacity: 0.1;
            transform: rotate(-20deg);
        }

        .stat-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 12px 25px rgba(45, 80, 22, 0.4);
            border-color: var(--primary-green);
        }

        .stat-card h3 {
            font-size: 1.1rem;
            color: var(--secondary-green);
            font-weight: 600;
        }

        .stat-card p {
            font-size: 2rem; /* Larger value */
            font-weight: 700;
            color: var(--primary-green);
            margin-top: 0.3rem;
            transition: color 0.3s;
        }
        
        .stat-card:hover p {
            color: var(--accent-gold); /* Value turns gold on hover */
            text-shadow: 0 0 5px rgba(255, 215, 0, 0.5);
        }

        /* ===== Badges Section (Collectibles) ===== */
        .badges-section {
            margin-top: 3rem;
        }

        .badges-section h3 {
            text-align: center;
            margin-bottom: 1.5rem;
            color: var(--primary-green);
            font-size: 1.8rem;
            font-weight: 700;
        }

        .badges {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 1.5rem;
        }

        .badge {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: radial-gradient(circle, #66bb6a, var(--secondary-green));
            border: 4px solid var(--accent-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: var(--transition-fast);
        }

        .badge:hover {
            transform: scale(1.15) rotate(-5deg);
            background: radial-gradient(circle, #FFEB3B, var(--accent-gold)); /* Glow brighter on hover */
        }
        
        /* New: Locked Badge Style */
        .badge.locked {
            background: var(--light-bg);
            border-color: var(--secondary-green);
            opacity: 0.5;
            cursor: not-allowed;
            filter: grayscale(100%);
        }
        .badge.locked:hover {
            transform: none;
            box-shadow: none;
            filter: grayscale(100%);
        }

        /* ===== Buttons Section (Actions) ===== */
        .action-buttons {
            margin-top: 3rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1.5rem;
        }

        .btn {
            background: linear-gradient(90deg, var(--secondary-green), var(--primary-green));
            color: var(--accent-gold);
            border: none;
            padding: 1rem 2rem;
            border-radius: 50px; /* Pill shape */
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
            transition: var(--transition-fast);
        }
        
        /* Unique button style for high contrast/importance */
        .btn-gold {
            background: linear-gradient(90deg, var(--accent-gold), #FFEB3B);
            color: var(--primary-green);
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.7);
        }

        .btn:hover {
            background: linear-gradient(90deg, var(--primary-green), var(--dark-bg));
            transform: translateY(-4px); /* Lift up */
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
        }
        .btn-gold:hover {
            background: var(--accent-gold);
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.9);
        }


        /* ===== Animations & Responsiveness (Kept and enhanced) ===== */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }
        
        /* New: Level Up Animation */
        @keyframes levelUp {
            0% { color: white; transform: scale(1); }
            50% { color: var(--accent-gold); transform: scale(1.2); }
            100% { color: var(--accent-gold); transform: scale(1); }
        }

        @media (max-width: 768px) {
            .profile-container {
                padding: 1.5rem;
                margin-top: 2rem;
            }
            .profile-header {
                flex-direction: column;
                text-align: center;
                gap: 1rem;
            }
            .profile-pic {
                width: 100px;
                height: 100px;
                outline-width: 3px;
                border-width: 3px;
            }
            .profile-info h2 {
                font-size: 1.8rem;
            }
            .stats-section {
                grid-template-columns: 1fr;
            }
            .btn {
                width: 100%;
                max-width: 300px;
            }
        }
    </style>
</head>

<body>
    <div class="floating-leaves">
        <div class="leaf"></div>
        <div class="leaf"></div>
        <div class="leaf"></div>
        <div class="leaf"></div>
        <div class="leaf"></div>
        <div class="leaf"></div>
        <div class="leaf"></div>
        <div class="leaf"></div>
    </div>

    <nav class="navbar">
        <div class="nav-content">
            <a href="dashboard.html" class="logo">
                <span>EcoFootprint Tracker</span>
            </a>
            <ul class="nav-links">
                <li><a href="dashboard.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="profile.html" class="active">Profile Settings</a></li>
                <li><a href="javascript:void(0)" onclick="logout(); return false;" style="color: #F0E68C;">Logout</a></li>
            </ul>
        </div>
    </nav>

    <div class="profile-container">
        <div class="profile-header">
            <img 
                src="./images/profilelogo.png" 
                alt="Profile Picture" 
                class="profile-pic" 
            />
            <div class="profile-info">
                <h2>Demo User</h2>
                <p class="level-tag">Eco Master • Level 12</p>
            </div>
        </div>

        <div class="progress-container">
            <div class="progress-bar" style="width: 70%;" id="xp-bar-visual"></div>
            <div class="progress-text" id="xp-text-label">XP: 840 / 1200</div>
        </div>
        

        <div class="stats-section">
            <div class="stat-card">
                <h3>Daily Streak</h3>
                <p>15 🔥</p>
            </div>
            <div class="stat-card">
                <h3>Challenges Completed</h3>
                <p>28 🏆</p>
            </div>
            <div class="stat-card">
                <h3>Total Eco Points</h3>
                <p>3,450 💰</p>
            </div>
        </div>

        <div class="badges-section">
            <h3>Collected Badges (Trophies)</h3>
            <div class="badges">
                <div class="badge" title="First Tree Planted">🌱</div>
                <div class="badge" title="Water Saver I">💧</div>
                <div class="badge" title="Solar Power User">☀️</div>
                <div class="badge" title="Recycle King">♻️</div>
                <div class="badge locked" title="Locked: Carbon Neutral Pro">🔒</div> 
            </div>
        </div>

        <div class="action-buttons">
            <button class="btn">Edit Profile</button>
            <button class="btn btn-gold">View Achievements</button>
            <button class="btn">Logout</button>
        </div>
    </div>
    
    <script>
        // Simple script to ensure the progress bar animation runs smoothly on load
        document.addEventListener('DOMContentLoaded', () => {
            const progressBar = document.getElementById('xp-bar-visual');
            // The width style attribute is set in the HTML for initial state,
            // but for the animation to run, you might set the width to 0 
            // initially in CSS and then set the final width here.
            // Since we set the style inline, we use JS to ensure the transition fires.
            // For a more dramatic effect, you'd set width: 0% in CSS and then:
            // progressBar.style.width = '70%'; 
        });
        function logout() {
            localStorage.removeItem('isLoggedIn');
            localStorage.removeItem('userEmail');
            window.location.href = 'index.html';
        }
    </script>

</body>
</html>
