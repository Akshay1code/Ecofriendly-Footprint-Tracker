<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eco Footprint Tracker - Carbon Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #094315 0%, #3f6b1b 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            animation: slideIn 0.8s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            padding: 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: rotate 20s linear infinite;
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
            position: relative;
            z-index: 1;
        }

        .calculator-section {
            padding: 40px;
        }

        .question-container {
            margin-bottom: 30px;
            opacity: 0;
            transform: translateX(-30px);
            animation: fadeInLeft 0.6s ease-out forwards;
        }

        .question-container:nth-child(2) { animation-delay: 0.1s; }
        .question-container:nth-child(3) { animation-delay: 0.2s; }
        .question-container:nth-child(4) { animation-delay: 0.3s; }
        .question-container:nth-child(5) { animation-delay: 0.4s; }
        .question-container:nth-child(6) { animation-delay: 0.5s; }

        @keyframes fadeInLeft {
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .question-label {
            display: block;
            font-size: 1.3em;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            position: relative;
        }

        .question-label::before {
            content: '🌱';
            margin-right: 10px;
            font-size: 1.2em;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }

        .input-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .input-field {
            flex: 1;
            min-width: 200px;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 1.1em;
            transition: all 0.3s ease;
            background: linear-gradient(145deg, #f8f9fa, #e9ecef);
        }

        .input-field:focus {
            outline: none;
            border-color: #4CAF50;
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.3);
            transform: translateY(-2px);
        }

        .unit-label {
            background: #4CAF50;
            color: white;
            padding: 15px 20px;
            border-radius: 25px;
            font-weight: 600;
            white-space: nowrap;
        }

        .radio-group {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .radio-option {
            position: relative;
        }

        .radio-option input[type="radio"] {
            display: none;
        }

        .radio-option label {
            display: flex;
            align-items: center;
            padding: 15px 25px;
            background: linear-gradient(145deg, #f8f9fa, #e9ecef);
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            font-size: 1.1em;
        }

        .radio-option input[type="radio"]:checked + label {
            background: linear-gradient(145deg, #4CAF50, #45a049);
            color: white;
            border-color: #4CAF50;
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
        }

        .radio-option label::before {
            content: '';
            margin-right: 10px;
            font-size: 1.2em;
        }

        .radio-option:nth-child(1) label::before { content: '🚗'; }
        .radio-option:nth-child(2) label::before { content: '🚌'; }
        .radio-option:nth-child(3) label::before { content: '🚲'; }
        .radio-option:nth-child(4) label::before { content: '🚶'; }

        .diet-option:nth-child(1) label::before { content: '🥗'; }
        .diet-option:nth-child(2) label::before { content: '🥩'; }

        .calculate-btn {
            display: block;
            width: 100%;
            max-width: 400px;
            margin: 40px auto;
            padding: 20px 40px;
            background: linear-gradient(145deg, #FF6B6B, #FF5252);
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 1.4em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .calculate-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            transition: all 0.6s ease;
            transform: translate(-50%, -50%);
        }

        .calculate-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255, 107, 107, 0.4);
        }

        .calculate-btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .calculate-btn:active {
            transform: translateY(-1px);
        }

        .results-section {
            display: none;
            padding: 40px;
            background: linear-gradient(145deg, #f8f9fa, #e9ecef);
            margin-top: 20px;
            border-radius: 10px;
            animation: slideUp 0.8s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .footprint-result {
            text-align: center;
            margin-bottom: 30px;
        }

        .footprint-value {
            font-size: 4em;
            font-weight: bold;
            color: #FF6B6B;
            margin: 20px 0;
            animation: countUp 2s ease-out;
        }

        @keyframes countUp {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }

        .footprint-label {
            font-size: 1.5em;
            color: #666;
            margin-bottom: 10px;
        }

        .comparison-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-value {
            font-size: 2.5em;
            font-weight: bold;
            color: #4CAF50;
            margin-bottom: 10px;
        }

        .stat-label {
            font-size: 1.1em;
            color: #666;
        }

        .suggestions {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .results-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        .results-back-btn {
            background: linear-gradient(145deg, #4CAF50, #45a049);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 1.2em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.3);
        }

        .results-back-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(76, 175, 80, 0.4);
        }

        .results-back-btn::before {
            content: '🏠';
            font-size: 1.1em;
        }

        .recalculate-btn {
            background: linear-gradient(145deg, #2196F3, #1976D2);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 1.2em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 5px 15px rgba(33, 150, 243, 0.3);
        }

        .recalculate-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(33, 150, 243, 0.4);
        }

        .recalculate-btn::before {
            content: '🔄';
            font-size: 1.1em;
        }

        .suggestions h3 {
            font-size: 1.8em;
            color: #4CAF50;
            margin-bottom: 20px;
            text-align: center;
        }

        .suggestion-list {
            list-style: none;
        }

        .suggestion-list li {
            padding: 15px 0;
            border-bottom: 1px solid #eee;
            font-size: 1.1em;
            color: #555;
            position: relative;
            animation: fadeIn 0.6s ease-out forwards;
            opacity: 0;
        }

        .suggestion-list li:nth-child(1) { animation-delay: 0.1s; }
        .suggestion-list li:nth-child(2) { animation-delay: 0.2s; }
        .suggestion-list li:nth-child(3) { animation-delay: 0.3s; }
        .suggestion-list li:nth-child(4) { animation-delay: 0.4s; }
        .suggestion-list li:nth-child(5) { animation-delay: 0.5s; }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        .suggestion-list li::before {
            content: '💡';
            margin-right: 15px;
            font-size: 1.2em;
        }

        .loading {
            display: none;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #4CAF50;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .container {
                margin: 10px;
                border-radius: 15px;
            }
            
            .header {
                padding: 20px;
                padding-top: 60px;
            }
            
            .header h1 {
                font-size: 2em;
            }
            
            .calculator-section {
                padding: 20px;
            }
            
            .input-group {
                flex-direction: column;
            }
            
            .radio-group {
                flex-direction: column;
            }
            
            .comparison-stats {
                grid-template-columns: 1fr;
            }
            
            .back-to-dashboard {
                top: 15px;
                left: 15px;
                padding: 10px 15px;
                font-size: 0.9em;
            }
            
            .results-actions {
                flex-direction: column;
                align-items: center;
            }
            
            .results-back-btn,
            .recalculate-btn {
                width: 100%;
                max-width: 250px;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌍 Carbon Footprint Calculator</h1>
            <p>Discover your environmental impact and make a difference!</p>
        </div>

        <div class="calculator-section">
            <form id="carbonForm">
                <div class="question-container">
                    <label class="question-label">How many kilometers do you travel per month?</label>
                    <div class="input-group">
                        <input type="number" id="travel_distance" class="input-field" placeholder="Enter distance" min="0" required>
                        <span class="unit-label">KM/month</span>
                    </div>
                </div>

                <div class="question-container">
                    <label class="question-label">What's your primary mode of transportation?</label>
                    <div class="radio-group">
                        <div class="radio-option">
                            <input type="radio" id="car" name="transport" value="car" required>
                            <label for="car">Car</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="public" name="transport" value="public">
                            <label for="public">Public Transport</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="bike" name="transport" value="bike">
                            <label for="bike">Bike/Walk</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="mixed" name="transport" value="mixed">
                            <label for="mixed">Mixed</label>
                        </div>
                    </div>
                </div>

                <div class="question-container">
                    <label class="question-label">What's your dietary preference?</label>
                    <div class="radio-group">
                        <div class="radio-option diet-option">
                            <input type="radio" id="vegan" name="diet" value="vegan" required>
                            <label for="vegan">Vegan/Vegetarian</label>
                        </div>
                        <div class="radio-option diet-option">
                            <input type="radio" id="non_vegan" name="diet" value="non_vegan">
                            <label for="non_vegan">Non-Vegetarian</label>
                        </div>
                    </div>
                </div>

                <div class="question-container">
                    <label class="question-label">How many flights do you take per year?</label>
                    <div class="input-group">
                        <input type="number" id="flights" class="input-field" placeholder="Number of flights" min="0" required>
                        <span class="unit-label">flights/year</span>
                    </div>
                </div>

                <div class="question-container">
                    <label class="question-label">What's your monthly electricity consumption?</label>
                    <div class="input-group">
                        <input type="number" id="electricity" class="input-field" placeholder="Enter kWh" min="0" required>
                        <span class="unit-label">kWh/month</span>
                    </div>
                </div>

                <button type="submit" class="calculate-btn">
                    🌱 Calculate My Footprint
                </button>
            </form>

            <div class="loading" id="loading">
                <div class="spinner"></div>
            </div>

            <div class="results-section" id="results">
                <div class="footprint-result">
                    <h2 class="footprint-label">Your Carbon Footprint</h2>
                    <div class="footprint-value" id="footprint-value">0</div>
                    <p>tonnes CO₂ per year</p>
                </div>

                <div class="comparison-stats">
                    <div class="stat-card">
                        <div class="stat-value" id="global-avg">6.8</div>
                        <div class="stat-label">Global Average</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="country-avg">4.2</div>
                        <div class="stat-label">Country Average</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="user-rank">-</div>
                        <div class="stat-label">Your Ranking</div>
                    </div>
                </div>

                <div class="suggestions">
                    <h3>🌱 Ways to Reduce Your Carbon Footprint</h3>
                    <ul class="suggestion-list" id="suggestions-list">
                        <!-- Suggestions will be dynamically generated -->
                    </ul>
                </div>

                <div class="results-actions">
                    <button class="recalculate-btn" onclick="recalculate()">Recalculate</button>
                    <a href="./dashboard.html" class="results-back-btn">Back to Dashboard</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('carbonForm').addEventListener('submit', function(e) {
            e.preventDefault();
            calculateFootprint();
        });

        function calculateFootprint() {
            // Show loading
            document.getElementById('loading').style.display = 'flex';
            document.getElementById('results').style.display = 'none';

            // Get form values
            const travelDistance = parseFloat(document.getElementById('travel_distance').value) || 0;
            const transport = document.querySelector('input[name="transport"]:checked').value;
            const diet = document.querySelector('input[name="diet"]:checked').value;
            const flights = parseFloat(document.getElementById('flights').value) || 0;
            const electricity = parseFloat(document.getElementById('electricity').value) || 0;

            // Calculate carbon footprint (simplified calculation)
            let footprint = 0;

            // Transportation calculation (kg CO2 per km per month * 12)
            const transportMultipliers = {
                car: 0.21,      // kg CO2 per km
                public: 0.05,   // kg CO2 per km
                bike: 0,        // kg CO2 per km
                mixed: 0.1      // kg CO2 per km
            };
            footprint += (travelDistance * transportMultipliers[transport] * 12) / 1000; // Convert to tonnes

            // Diet calculation (tonnes CO2 per year)
            const dietEmissions = {
                vegan: 1.5,
                non_vegan: 3.3
            };
            footprint += dietEmissions[diet];

            // Flights calculation (average 0.5 tonnes CO2 per flight)
            footprint += flights * 0.5;

            // Electricity calculation (kg CO2 per kWh * monthly * 12 months)
            footprint += (electricity * 0.5 * 12) / 1000; // Convert to tonnes

            // Simulate loading time
            setTimeout(() => {
                displayResults(footprint, transport, diet, flights);
            }, 2000);
        }

        function displayResults(footprint, transport, diet, flights) {
            // Hide loading and show results
            document.getElementById('loading').style.display = 'none';
            document.getElementById('results').style.display = 'block';

            // Animate footprint value
            animateValue('footprint-value', 0, footprint, 2000);

            // Generate user ranking
            const rankings = ['Excellent', 'Good', 'Average', 'Above Average', 'High'];
            let rankIndex;
            if (footprint < 2) rankIndex = 0;
            else if (footprint < 4) rankIndex = 1;
            else if (footprint < 6) rankIndex = 2;
            else if (footprint < 8) rankIndex = 3;
            else rankIndex = 4;

            document.getElementById('user-rank').textContent = rankings[rankIndex];

            // Generate personalized suggestions
            generateSuggestions(transport, diet, flights, footprint);

            // Scroll to results
            document.getElementById('results').scrollIntoView({ behavior: 'smooth' });
        }

        function animateValue(id, start, end, duration) {
            const element = document.getElementById(id);
            const increment = (end - start) / (duration / 16);
            let current = start;

            const timer = setInterval(() => {
                current += increment;
                if (current >= end) {
                    element.textContent = end.toFixed(1);
                    clearInterval(timer);
                } else {
                    element.textContent = current.toFixed(1);
                }
            }, 16);
        }

        function generateSuggestions(transport, diet, flights, footprint) {
            const suggestionsList = document.getElementById('suggestions-list');
            suggestionsList.innerHTML = '';

            const suggestions = [];

            // Transportation suggestions
            if (transport === 'car') {
                suggestions.push('Consider using public transportation or carpooling to reduce emissions by up to 50%');
                suggestions.push('Switch to an electric or hybrid vehicle for your next car purchase');
            }

            // Diet suggestions
            if (diet === 'non_vegan') {
                suggestions.push('Try "Meatless Mondays" - reducing meat consumption just one day per week can save 1,900 lbs of CO₂ annually');
            }

            // Flight suggestions
            if (flights > 2) {
                suggestions.push('Consider virtual meetings or train travel for shorter trips to reduce flight emissions');
                suggestions.push('When flying is necessary, choose direct flights and economy class to minimize your impact');
            }

            // Energy suggestions
            suggestions.push('Switch to LED bulbs and unplug electronics when not in use to reduce electricity consumption');
            suggestions.push('Use renewable energy sources like solar panels if possible');

            // General suggestions
            if (footprint > 6) {
                suggestions.push('Your footprint is above average - small changes can make a big difference!');
            } else {
                suggestions.push('Great job! Your footprint is below average - keep up the good work!');
            }

            // Add suggestions to the list
            suggestions.forEach(suggestion => {
                const li = document.createElement('li');
                li.textContent = suggestion;
                suggestionsList.appendChild(li);
            });
        }

        // Add some interactive effects
        document.querySelectorAll('.input-field').forEach(field => {
            field.addEventListener('focus', function() {
                this.parentElement.style.transform = 'scale(1.02)';
            });

            field.addEventListener('blur', function() {
                this.parentElement.style.transform = 'scale(1)';
            });
        });

        // Add hover effects to radio buttons
        document.querySelectorAll('.radio-option label').forEach(label => {
            label.addEventListener('mouseenter', function() {
                if (!this.previousElementSibling.checked) {
                    this.style.transform = 'scale(1.05)';
                }
            });

            label.addEventListener('mouseleave', function() {
                if (!this.previousElementSibling.checked) {
                    this.style.transform = 'scale(1)';
                }
            });
        });

        // Recalculate function
        function recalculate() {
            // Hide results and show form again
            document.getElementById('results').style.display = 'none';
            document.getElementById('carbonForm').reset();
            
            // Scroll back to top of calculator
            document.querySelector('.calculator-section').scrollIntoView({ 
                behavior: 'smooth',
                block: 'start'
            });
        }
    </script>
</body>
</html>
